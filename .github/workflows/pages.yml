# Save this file in the repo as:  .github/workflows/pages.yml
#
# On every push to main it
#   1) runs build-index.py  -> creates content-index.json from en/YEAR/Month.html and te/YEAR/Month.html
#   2) publishes the repo to GitHub Pages
# so a new issue shows up in the app about a minute after you push it.
#
# One-time setting:  Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"

name: Build index and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build content-index.json
        run: python build-index.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
