<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>Yojana Magazine Analysis · VibhillionAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Serif+4:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@500;700&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem('yj_theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';
if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
<style>
:root{
  --green:#0F766E; --green-d:#0B5A54; --orange:#FF8A24; --orange-ink:#8A4300; --orange-t:#A34A00;
  --blue:#123B5D; --blue-2:#2A5679;
  --bg:#F4FBF8; --mint:#ECF8F4; --mint-2:#E1F4EF; --line:#D5EDE6; --line-2:#BFE3DA;
  --card:#FFFFFF; --peach:#FFEAD3; --sky:#E3ECF5;
  --ink:#123B5D; --ink-2:#41566A; --muted:#5B6B7A; --off:#8896A0;
  --r-lg:20px; --r-md:14px;
  --sans:'Plus Jakarta Sans','Noto Sans Telugu',system-ui,sans-serif;
  --surface:#fff; --surface-glass:rgba(255,255,255,.97);
  --gov:'Noto Sans','Noto Sans Telugu',system-ui,sans-serif;   /* Yojana name: font family used on Government of India portals */
  --serif:'Source Serif 4','Noto Serif Telugu',Georgia,serif;
}
html[lang="te"]{--gov:'Noto Sans Telugu','Noto Sans',system-ui,sans-serif;--sans:'Noto Sans Telugu','Plus Jakarta Sans',system-ui,sans-serif;--serif:'Noto Serif Telugu','Source Serif 4',Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
svg{flex:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;background:var(--surface-glass);backdrop-filter:blur(8px);border-bottom:3px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img,.brand svg{width:36px;height:36px;border-radius:10px;object-fit:contain}
.brand b{font-size:16px;font-weight:800;display:block;line-height:1.1;font-family:'Plus Jakarta Sans',sans-serif}
.brand small{font-size:11px;font-weight:600;color:var(--green);display:block}
.tb-title{flex:1;min-width:0;line-height:1.2}
.tb-title b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:hover{background:var(--mint)}
.lang{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--mint-2);flex:none}
.lang a{min-width:40px;height:38px;padding:0 10px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;font-weight:800;color:var(--green-d)}
.lang a.te{font-family:'Noto Sans Telugu',sans-serif;font-size:14px}
.lang a.on{background:var(--green);color:#fff}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 16px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--mint);border-bottom:1px solid var(--line)}
.crumbs a{color:var(--green);min-height:28px;display:inline-flex;align-items:center}
.crumbs a:hover{text-decoration:underline}
.crumbs .here{color:var(--ink);font-weight:800}
.view{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px}

/* common */
h1,h2,h3{margin:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-head h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
.sec-head h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--orange);flex:none}
.sec-head .link{font-size:13px;font-weight:700;color:var(--green);min-height:44px;display:flex;align-items:center}
.sub{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.pill.or{background:var(--orange);color:var(--blue)}
.pill.sm{background:var(--peach);color:var(--orange-t)}
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--green);color:#fff;padding:20px;box-shadow:inset 0 -6px 0 var(--orange)}
.hero .orb{position:absolute;right:-44px;top:-50px;width:160px;height:160px;border-radius:50%;background:var(--blue);opacity:.35}
.hero .mag{position:absolute;right:24px;top:22px;width:40px;height:54px;border-radius:6px;background:var(--orange);transform:rotate(9deg)}
.hero .mag2{position:absolute;right:40px;top:28px;width:40px;height:54px;border-radius:6px;background:var(--surface);opacity:.92;transform:rotate(-6deg)}
.hero h1{position:relative;margin:10px 0 8px;font-size:25px;line-height:1.25;font-weight:800;max-width:calc(100% - 70px)}
.hero h1::after{content:"";display:block;width:64px;height:5px;border-radius:3px;background:var(--orange);margin-top:10px}
.hero p{position:relative;margin:0;font-size:13.5px;line-height:1.6;color:#E6F5F1;max-width:620px}
.stats{position:relative;display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{min-width:84px;padding:10px 14px;border-radius:14px;background:var(--blue)}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--orange);font-family:'Plus Jakarta Sans',sans-serif}
.stat span{font-size:11.5px;color:#CFE6E2}
.search label{display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 14px;background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r-md)}
.search label:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14.5px}
.search input::placeholder{color:#6B7C86}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.row{display:flex;align-items:center;gap:12px;padding:12px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--green);transform:translateY(-1px)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:42px;height:42px;flex:none;border-radius:12px;background:var(--peach);color:var(--orange-t);display:flex;align-items:center;justify-content:center}
.count{background:var(--peach);color:var(--orange-ink);font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:10px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1.5px dashed var(--line-2);border-radius:var(--r-lg)}
.note{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:var(--peach);color:#5C2E00;font-size:12.5px;line-height:1.55}

/* magazine covers (drawn in CSS — month + theme, VibhillionAI colours) */
.cover{position:relative;aspect-ratio:3/4;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:inset 0 -6px 0 var(--strip),0 6px 14px rgba(18,59,93,.12);background:var(--cbg);color:var(--cfg)}
.cover .mh{font-size:9px;font-weight:800;letter-spacing:.2em;opacity:.95;font-family:'Noto Sans',sans-serif}
.cover .mh.te{letter-spacing:.02em;font-size:12px;font-weight:700;font-family:'Noto Sans Telugu','Noto Sans',sans-serif}
.cover .mo{font-size:24px;font-weight:800;line-height:1;font-family:'Plus Jakarta Sans','Noto Sans Telugu',sans-serif}
.cover .th{font-size:10.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cover .deco{position:absolute;right:-18px;top:34%;width:60px;height:60px;border-radius:50%;border:8px solid currentColor;opacity:.12}
.cover.lg{border-radius:14px;padding:14px}
.cover.lg .mh{font-size:11px}.cover.lg .mh.te{font-size:13px}
.cover.lg .mo{font-size:38px}
.cover.lg .th{font-size:12.5px}
.cover.te .mo{font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.cover.lg.te .mo{font-size:22px}
@media (min-width:1024px){.cover.te .mo{font-size:20px}}
.c0{--cbg:#0F766E;--cfg:#fff;--strip:#FF8A24}
.c1{--cbg:#123B5D;--cfg:#fff;--strip:#FF8A24}
.c2{--cbg:#FF8A24;--cfg:#123B5D;--strip:#123B5D}
.c3{--cbg:#0B5A54;--cfg:#fff;--strip:#FFB46E}
.c4{--cbg:#2A5679;--cfg:#fff;--strip:#FF8A24}
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ci{display:flex;flex-direction:column;gap:6px;transition:transform .15s}
a.ci:hover{transform:translateY(-3px)}
.ci .cap{font-size:11.5px;font-weight:700;color:var(--ink-2);padding-left:2px}
.ci.off .cover{background:none;box-shadow:none;border:1.5px dashed #C4D3D0;color:#6B7C86;align-items:center;justify-content:center;gap:4px}
.ci.off .cap{color:var(--off);font-weight:600}

/* latest issue card */
.latest{display:flex;gap:14px;padding:12px;border-top:4px solid var(--green)}
.latest .cover{width:100px;flex:none}
.latest .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.latest .mon{font-size:12.5px;font-weight:800;color:var(--orange-t)}
.latest .theme{font-family:var(--serif);font-size:19px;line-height:1.3;font-weight:700}
/* year cards & tabs */
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.ycard{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px;min-height:84px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line-2)}
.ycard:hover{border-color:var(--green)}
.ycard b{font-size:26px;font-weight:800;line-height:1;font-family:'Plus Jakarta Sans',sans-serif}
.ycard span{font-size:12px;color:var(--muted)}
.ycard.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:inset 0 -5px 0 var(--orange)}
.ycard.on span{color:#E6F5F1}
.seg{display:flex;gap:6px;padding:4px;background:var(--mint-2);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a{flex:1 0 auto;min-width:72px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:11px;font-size:15px;font-weight:700;padding:0 14px;font-family:'Plus Jakarta Sans',sans-serif}
.seg a.on{background:var(--green);color:#fff;font-weight:800;box-shadow:inset 0 -3px 0 var(--orange)}
/* issue header */
.ihead{display:flex;gap:16px;align-items:stretch;padding:16px;border-radius:22px;background:var(--green);color:#fff;box-shadow:inset 0 -6px 0 var(--orange)}
.ihead .cover{width:96px;flex:none}
.ihead .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:#FFD3A8}
.ihead h1{font-family:var(--serif);font-size:21px;line-height:1.3;font-weight:700;margin:6px 0}
.ihead .meta{font-size:12.5px;color:#E6F5F1}
.ihead .src{font-size:12px;color:#E6F5F1;margin-top:6px}
.glance{padding:0 14px}
.glance summary{min-height:50px;display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:800;cursor:pointer;list-style:none}
.glance summary::-webkit-details-marker{display:none}
.glance summary span{font-size:12px;font-weight:700;color:var(--orange-t)}
.glance ol{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:var(--ink-2)}
/* prev/next */
.pn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pn a,.pn div{min-height:52px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line-2);font-size:13px;font-weight:700;color:var(--green)}
.pn a:hover{border-color:var(--green)}
.pn .nx{justify-content:flex-end;text-align:right}
.pn div{border-style:dashed;border-color:#C4D3D0;background:none;color:#6B7C86}
.pn small{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.pn .lab{display:flex;flex-direction:column;line-height:1.25;min-width:0}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip em{font-style:normal;opacity:.75;margin-left:4px}
/* table of contents */
.toc{display:flex;flex-direction:column;gap:12px}
.ti{display:flex;gap:14px;padding:16px;border-top:4px solid var(--green)}
.ti .no{font-family:'Source Serif 4',Georgia,serif;font-size:28px;font-weight:700;line-height:1;color:var(--orange-t);width:38px;flex:none}
.ti .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ti .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ti h3{font-size:16.5px;line-height:1.4;font-weight:800}
.ti .by{font-size:12.5px;color:var(--muted)}
.ti p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.ti .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:2px}
.facts{background:var(--mint);border-radius:12px;padding:10px 12px}
.facts .k,.kp-title{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--orange-t);margin-bottom:4px}
.facts ul{margin:0;padding-left:17px;font-size:13px;line-height:1.6}
.rel{font-size:11.5px;font-weight:700;color:var(--orange-ink);background:var(--peach);padding:4px 10px;border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:12px;background:var(--green);color:#fff;font-size:13.5px;font-weight:700;border:0}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:var(--surface);color:var(--green);border:1.5px solid var(--line-2)}
.cat{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.k0{background:var(--mint-2);color:var(--green-d)}.k1{background:var(--sky);color:var(--blue)}.k2{background:#E8E4F6;color:#3D2E7A}
.k3{background:var(--peach);color:var(--orange-ink)}.k4{background:#E2F3DD;color:#2D5A1E}.k5{background:#DDF0F6;color:#0E5068}.k6{background:#F6E2E6;color:#7A2335}
/* reader */
.reader{display:flex;flex-direction:column;gap:14px}
.reader-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.reader h1.hl{font-family:var(--serif);font-size:26px;line-height:1.32;font-weight:700}
.reader h1.hl::after{content:"";display:block;width:72px;height:5px;border-radius:3px;background:var(--orange);margin-top:12px}
.author{display:flex;align-items:center;gap:10px}
.author .av{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.author b{display:block;font-size:13.5px}
.author span{font-size:12px;color:var(--muted)}
.reader-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.frame-box{flex:999 1 520px;min-width:0;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:var(--r-lg);overflow:hidden}
.frame-box iframe{display:block;width:100%;height:70vh;min-height:240px;border:0}
.aside{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:14px}
.kp{background:var(--mint);border:1px solid #CDEBE3;border-radius:var(--r-lg);padding:16px}
.kp ol{margin:0;padding-left:20px;font-size:14px;line-height:1.65}
.exam{background:var(--peach);color:#5C2E00;border-radius:var(--r-lg);padding:14px 16px;font-size:13.5px;line-height:1.55}
.exam b{display:block;font-size:10.5px;letter-spacing:.08em;margin-bottom:2px}
.more a{display:block;padding:10px 12px;border-radius:12px;background:var(--bg);min-height:44px}
.more a:hover{background:var(--mint-2)}
.more a b{display:block;font-size:13.5px}
.more a span{font-size:12px;color:var(--muted)}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--green);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
mark{background:#FFE1B8;color:inherit;border-radius:3px;padding:0 1px}
.footer{padding:20px 16px 24px;text-align:center;font-size:12px;line-height:1.6;color:#E6F5F1;border-top:4px solid var(--orange);background:var(--green)}
.footer b{color:#fff}
.footer .srclogo{display:block;margin:0 auto 8px;height:34px;width:auto}

@media (min-width:560px){
  .covers{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero{padding:26px 28px}
  .hero h1{font-size:30px}
  .ihead .cover{width:120px}
  .ihead h1{font-size:26px}
}
@media (min-width:1024px){
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto;width:256px;flex:none;background:var(--green-d);color:#fff;padding:22px 14px}
  .side .brand{padding:0 8px}
  .side .brand small{color:#FFC48F}
  .snav{display:flex;flex-direction:column;gap:4px}
  .snav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:#DDF2EC;font-size:14px;font-weight:600}
  .snav a:hover{background:rgba(255,255,255,.08)}
  .snav a.on{background:var(--orange);color:var(--blue);font-weight:800}
  .sdiv{height:1px;background:rgba(255,255,255,.22)}
  .stitle{padding:0 12px;font-size:11px;font-weight:800;letter-spacing:.1em;color:#FFC48F}
  .tree a{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:700;color:#DDF2EC}
  .tree a:hover{background:rgba(255,255,255,.08)}
  .tree a.on{color:#fff;font-weight:800}
  .tree a.m{margin-left:12px;font-size:13.5px;font-weight:600}
  .tree a.m.on{background:var(--orange);color:var(--blue)}
  .tree small{font-size:12px;opacity:.85}
  .topbar .brand{display:none}
  .topbar{padding:0 24px;height:64px}
  .crumbs{padding:10px 28px}
  .view{padding:26px 28px 40px;gap:22px}
  .covers{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
  .reader h1.hl{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Yojana wordmark (government font) ---------- */
.wordmark{position:relative;display:inline-block;font-family:var(--gov);font-weight:800;font-size:15px;letter-spacing:.18em;color:#fff;margin-bottom:2px}
html[lang="te"] .wordmark{letter-spacing:.04em;font-size:17px}
.latest .mon .gov,.ihead .gov{font-family:var(--gov)}

/* ---------- compact top bar so the title keeps room next to the language switch ---------- */

/* ---------- brand: logo stays on inner pages, name hides ---------- */
.brand.compact>span:last-child{display:none}

/* ---------- full-screen issue ---------- */

  paint();

})();
</script>

var INDEX=null, ISS={en:[],te:[]};
function buildFlat(){
  ['en','te'].forEach(function(lg){
    var ed=(INDEX.editions||{})[lg]||{}, out=[];
    Object.keys(ed).forEach(function(y){
      Object.keys(ed[y]).forEach(function(m){
        var mi=MONTHS.indexOf(m); if(mi<0) return;
        var e=ed[y][m];
        out.push({lang:lg,y:y,m:m,mi:mi,sort:(+y)*12+mi,path:CONFIG.siteBase+e.path,theme:e.theme||'',glance:e.glance||[],
          articles:(e.articles||[]).map(function(a,i){a.id=a.id||('a'+(i+1));return a;})});
      });
    });
    out.sort(function(a,b){return b.sort-a.sort;});
    ISS[lg]=out;
  });
}

      var when=(MONTHS[x.mi]+' '+MONTHS_TE[x.mi]+' '+x.y+' '+x.theme).toLowerCase();
      x.articles.forEach(function(a){
        var txt=(when+' '+a.title+' '+(a.summary||'')+' '+a.category+' '+(a.author||'')+' '+(a.facts||[]).join(' ')+' '+(a.relevance||'')).toLowerCase();
        if(terms.every(function(t){return txt.indexOf(t)>=0;})) res.push([x,a,x.articles.indexOf(a)+1]);
      });
    });
  }
  view.innerHTML=searchBox(q)+(!q?'<div class="empty">'+esc(L.typeQ)+'</div>':
    '<section class="stack"><div class="sec-head"><h2>'+res.length+' '+esc(res.length===1?L.result:L.results)+'</h2></div>'+
    (res.length?'<div class="toc">'+res.slice(0,60).map(function(r){return tocItem(r[0],r[1],r[2],qre);}).join('')+'</div>':'<div class="empty">'+esc(L.noMatch)+' “'+esc(q)+'”.</div>')+'</section>');
  bindSearch();
  var inp=$('#q'),tm; if(inp){ if(!q) inp.focus();
    inp.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){history.replaceState(null,'',base()+'/search/'+encodeURIComponent(inp.value.trim()));route(true);},350);});}
}
function nf(){setChrome({title:'—',back:base(),crumbs:[]});view.innerHTML='<div class="empty">'+esc(L.notFound)+' <a href="'+base()+'" style="color:var(--green);font-weight:700">'+esc(L.goHome)+'</a></div>';}

/* ============ router ============
   #/en  #/en/2026  #/en/2026/October  #/en/2026/October/a1  #/en/search/<q>   (same with te) */
function route(keep){
  var p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/').filter(Boolean);
  if(p[0]!=='en'&&p[0]!=='te'){ location.replace('#/'+store.get('yj_lang',CONFIG.defaultLang)+(p.length?'/'+p.join('/'):'')); return; }
  LANG=p.shift(); L=T[LANG]; store.set('yj_lang',LANG);
  if(p[0]==='search'){ sSearch(p.slice(1).join('/')); if(!keep){var q=$('#q'); if(q){q.focus();var v=q.value;q.value='';q.value=v;}} return; }
  document.body.classList.remove('fullday-on');
  if(!keep) window.scrollTo(0,0);
  if(!p.length) sHome(); else if(p.length===1) sYear(p[0]); else sFull(p[0],p[1]);   // an issue opens its HTML page full screen
}
window.addEventListener('hashchange',function(){route(false);});
function boot(d){INDEX=d&&d.editions?d:{editions:{}};buildFlat();route(false);}
view.innerHTML='<div class="loading"><span class="spin"></span>'+esc(L.loading)+'</div>';
fetch(CONFIG.siteBase+CONFIG.indexJson,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(boot)
  .catch(function(){boot({editions:{}}); view.insertAdjacentHTML('afterbegin','<div class="note"><p style="margin:0">Could not load <b>content-index.json</b>. Check the internet connection, and that the <b>Actions</b> tab of the repo shows a green run of the Pages workflow.</p></div>');});
})();
</script>
